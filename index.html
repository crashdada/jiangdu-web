<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>江都记胡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="江都记胡">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>江都记胡</h1>
  <button class="link" id="btn-settings">设置</button>
</header>

<main>
  <section class="card score" id="score">
    <div class="label">最终分</div>
    <div class="big" id="score-num">0</div>
    <div class="sub" id="score-sub">胡子 0 × 2^0 = ×1</div>
  </section>

  <div class="actions">
    <button class="btn primary" id="btn-cam">拍照识别</button>
    <button class="btn" id="btn-pick">从相册选</button>
  </div>
  <p class="hint" id="hint">摆法：3 张一行 = 碰 ｜ 3 张品字（上横下竖）= 暗刻 ｜ 4 张一行 = 明杠 ｜ 3 背 1 面 = 暗杠</p>
  <p class="hint" id="rot-hint" hidden></p>

  <h2 class="section">加组</h2>
  <div class="chips" id="add-chips"></div>

  <h2 class="section" id="groups-title">已录 0 组</h2>
  <div id="groups" class="groups"></div>

  <h2 class="section">花牌</h2>
  <div class="chips" id="flower-chips"></div>

  <h2 class="section">我是哪家（决定门风 + 对应花）</h2>
  <div class="chips" id="seat-chips"></div>

  <h2 class="section">本局圈风</h2>
  <div class="chips" id="wind-chips"></div>

  <div class="footer">
    <button class="link" id="btn-clear">清空重来</button>
    <button class="link" id="btn-update">强制更新</button>
    <span class="ver" id="ver"></span>
  </div>
</main>

<!-- 选牌 -->
<div class="modal" id="picker" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <strong id="picker-title">选牌</strong>
      <button class="link" id="picker-close">取消</button>
    </div>
    <div id="picker-body"></div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settings" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <strong>云端识别设置</strong>
      <button class="link" id="settings-close">关闭</button>
    </div>
    <label>接口地址<input id="s-base" type="url" autocomplete="off" value="https://api.deepseek.com" placeholder="https://api.deepseek.com"></label>
    <label>模型<input id="s-model" type="text" autocomplete="off" value="deepseek-flash" placeholder="deepseek-flash"></label>
    <label>API Key<input id="s-key" type="password" autocomplete="off" placeholder="留空则只能手动录牌"></label>
    <p class="hint">Key 只存在这台手机的浏览器里，直接发给 DeepSeek，不经过任何中转。</p>
    <div class="actions">
      <button class="btn" id="s-test">测试连接</button>
      <button class="btn primary" id="s-save">保存</button>
    </div>
    <p class="hint" id="s-result"></p>
  </div>
</div>

<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-pick" accept="image/*" hidden>

<script>
// 出错时把原因显示在页面上：开发侧看不到渲染结果，只能靠这个把错误带出来
(function () {
  function show(msg, extra) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b00020;' +
      'color:#fff;padding:10px 12px;font:12px/1.5 -apple-system,sans-serif;white-space:pre-wrap';
    d.textContent = '页面出错：' + msg + (extra ? '\n' + extra : '');
    document.body.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    show(e.message || String(e), (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show((e.reason && (e.reason.message || e.reason)) || 'Promise 异常');
  });
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
